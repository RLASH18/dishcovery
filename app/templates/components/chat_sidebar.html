<!-- New Chat -->
<div class="px-4 pt-2 pb-4">
    <button id="btn-new-chat"
        class="w-full bg-primary/10 text-primary hover:bg-primary hover:text-white font-semibold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-5 h-5"></i>
        New Discovery
    </button>
</div>

<!-- Chat List -->
<div class="flex-1 overflow-y-auto p-4">
    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 px-2">Recent Chats</h3>
    <div id="chat-list" class="space-y-1">
        <!-- Injected -->
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const app = window.dashboardChatApp;
        const chatList = document.getElementById('chat-list');
        const btnNewChat = document.getElementById('btn-new-chat');

        // Check if app and DOM elements exist
        if (!app || !chatList || !btnNewChat) {
            return;
        }

        // Fetch and display the list of chats
        async function loadChatList() {
            try {
                const chats = await app.api.fetchChats();
                chatList.innerHTML = '';

                // Show empty state if no chats
                if (chats.length === 0) {
                    chatList.innerHTML = '<p class="text-xs text-gray-400 px-3 py-2">No chats yet. Start a new one!</p>';
                    return chats;
                }

                chats.forEach((chat) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-50 text-gray-700 text-sm flex items-center gap-3 transition-colors group ${chat.id === app.state.currentChatId ? 'bg-primary/10 text-primary' : ''}`;
                    btn.innerHTML = `
                        <i data-lucide="message-square" class="w-4 h-4 text-gray-400 flex-shrink-0"></i>
                        <span class="truncate flex-1">${app.escapeHtml(chat.title)}</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500 delete-chat-btn" data-id="${chat.id}">
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </span>`;

                    btn.addEventListener('click', (event) => {
                        // Ignore click if delete button was clicked
                        if (event.target.closest('.delete-chat-btn')) {
                            return;
                        }

                        // Set active chat and load messages
                        app.state.currentChatId = chat.id;
                        app.emit('chat:selected', { chatId: chat.id });
                        loadChatList();
                    });

                    chatList.appendChild(btn);
                });

                // Add delete event listeners to buttons
                chatList.querySelectorAll('.delete-chat-btn').forEach((deleteBtn) => {
                    deleteBtn.addEventListener('click', async (event) => {
                        event.stopPropagation();
                        const id = Number(deleteBtn.dataset.id);

                        try {
                            // Delete chat from database
                            await app.api.deleteChat(id);
                            const wasActive = id === app.state.currentChatId;

                            // Reset active chat if it was deleted
                            if (wasActive) {
                                app.state.currentChatId = null;
                            }

                            // Notify other components of deletion
                            app.emit('chat:deleted', { chatId: id, wasActive });
                            if (!wasActive) {
                                await loadChatList();
                            }
                        } catch (error) {
                            console.error('Failed to delete chat:', error);
                        }
                    });
                });

                lucide.createIcons();
                return chats;
            } catch (error) {
                console.error('Failed to load chats:', error);
                return [];
            }
        }

        // Create a new chat and update state
        async function createNewChat() {
            try {
                const data = await app.api.createChat();
                app.state.currentChatId = data.chat_id;
                app.state.ingredients = [];
                await loadChatList();

                // Notify other components of new chat
                app.emit('chat:created', { chatId: data.chat_id });
                return data.chat_id;
            } catch (error) {
                console.error('Failed to create chat:', error);
                return null;
            }
        }

        // Handle new chat button click
        btnNewChat.addEventListener('click', () => {
            createNewChat();
        });

        // Expose public sidebar methods
        app.sidebar = {
            loadChatList,
            createNewChat,
        };

        // Listen for chat list refresh events
        app.on('chat:list:refresh', () => {
            loadChatList();
        });
    });
</script>
